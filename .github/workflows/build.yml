name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 24.04 image already ships the Android SDK (ANDROID_HOME)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk catatku.apk

      - uses: actions/upload-artifact@v5
        with:
          name: catatku-apk
          path: catatku.apk

      - name: Publish release (download link tetap)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Catatku terbaru
          files: catatku.apk
          make_latest: true
