name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk catatku.apk

      - uses: actions/upload-artifact@v4
        with:
          name: catatku-apk
          path: catatku.apk

      - name: Publish release (download link tetap)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Catatku terbaru
          files: catatku.apk
          make_latest: true
